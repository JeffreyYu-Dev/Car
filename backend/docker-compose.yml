services:
  llama-cpp-embedding:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama-cpp-embedding
    ports:
      - "5173:5173"
    volumes:
      - ./models:/models
    command: >
      --model /models/Qwen3-Embedding-0.6B-Q8_0.gguf
      --port 5173
      --embedding
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: backend-server
    ports:
      - "4000:4000"
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      - EMBEDDING_URL=http://llama-cpp-embedding:5173
    env_file:
      - ./server/.env
    depends_on:
      llama-cpp-embedding:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dev
    container_name: backend-dashboard
    ports:
      - "5000:5000"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    environment:
      # Browser-side fetches, so this must be reachable from the host, not
      # the "server" container hostname.
      - VITE_API_URL=http://localhost:4000
      # Route loaders can also run server-side (SSR), inside this container —
      # there "localhost" is the dashboard itself, so use the in-network
      # service address instead.
      - VITE_API_URL_INTERNAL=http://server:4000
    depends_on:
      server:
        condition: service_healthy
